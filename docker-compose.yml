version: '3.8'

services:
  vera-bot:
    build: .
    container_name: magicpin-vera-bot
    ports:
      - "8080:8080"
    restart: always
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
